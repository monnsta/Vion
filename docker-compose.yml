services:
  bot:
    build: .
    container_name: vion
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./configure.ial:/app/configure.ial
      - ./core:/app/core
      - ./meta:/app/meta
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

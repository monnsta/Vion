[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Vion"
version = "1.0.0"
description = "An AI agent that is designed to be able to do ANYTHING within discord."
readme = "README.md"
requires-python = ">=3.11"
authors = [
	{ name="monnsta" }
]
dependencies = [
	"discord.py",
	"discord-ext-voice-recv",
	"davey",
	"google-genai",
	"rich",
	"pytz",
	"httpx",
	"PyNaCl",
	"orjson",
	"PyYAML",
	"yt-dlp",
	"matplotlib"
]
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
	"Topic :: Communications :: Chat",
]

[project.scripts]
vion = "vion.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vion*", "extensions*"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.jpg", "*.json", "*.yaml", "*.template"]

[tool.pyright]
venvPath = "."
venv = ".venv"

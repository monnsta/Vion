[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vion"
version = "0.1.0"
description = "An AI agent that is designed to be able to do ANYTHING within discord."
readme = "README.md"
requires-python = ">=3.11"
authors = [
	{ name="monnsta" }
]
dependencies = [
	"discord.py~=2.3.2",
	"orjson~=3.10.3",
	"pytz~=2024.1",
	"rich~=13.7.1",
	"google-genai~=0.3.0",
	"httpx~=0.27.0",
	"ial @ git+https://github.com/monnsta/IAL.git"
]
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
	"Topic :: Communications :: Chat",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vion"
version = "0.1.0"
description = "An AI agent that is designed to be able to do ANYTHING within discord."
readme = "README.md"
requires-python = ">=3.7"
authors = [
	{ name="IAL Contributors" }
]
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
]